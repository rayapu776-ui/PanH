<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>panH - Privacy Guardian</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="../icons/icon32.png" alt="panH Logo" class="brand-icon">
        <span class="brand-name">panH</span>
      </div>
      <div class="status-badge" id="shieldStatusBadge">
        <span class="status-dot"></span>
        <span class="status-text">Active</span>
      </div>
    </header>

    <!-- Protection Score Card -->
    <section class="score-card">
      <div class="score-circle-wrapper">
        <svg class="score-circle" viewBox="0 0 100 100">
          <circle class="score-bg" cx="50" cy="50" r="42" />
          <circle class="score-fill" id="scoreCircleFill" cx="50" cy="50" r="42" />
        </svg>
        <div class="score-number-wrapper">
          <span class="score-value" id="siteScoreValue">82</span>
        </div>
      </div>
      <div class="score-info">
        <h2 class="score-rating" id="siteScoreRating">Good protection</h2>
        <p class="site-hostname" id="siteHostname">news-site.com</p>
      </div>
    </section>

    <!-- Metrics List -->
    <section class="metrics-list">
      <div class="metric-row">
        <div class="metric-label">
          <svg class="metric-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          <span>Trackers blocked</span>
        </div>
        <span class="metric-badge badge-trackers" id="trackersCount">23</span>
      </div>

      <div class="metric-row">
        <div class="metric-label">
          <svg class="metric-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="m9 9 6 6m0-6-6 6" />
          </svg>
          <span>Ads blocked</span>
        </div>
        <span class="metric-badge badge-ads" id="adsCount">41</span>
      </div>

      <div class="metric-row">
        <div class="metric-label">
          <svg class="metric-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 8v4m0 4h.01" />
          </svg>
          <span>First-party tracking</span>
        </div>
        <span class="metric-badge badge-firstparty" id="firstPartyCount">2 found</span>
      </div>
    </section>

    <!-- Quick Toggles -->
    <section class="toggles-section">
      <div class="toggle-row">
        <span class="toggle-label">Fingerprint shield</span>
        <label class="switch">
          <input type="checkbox" id="toggleFingerprint" checked>
          <span class="slider round"></span>
        </label>
      </div>

      <div class="toggle-row">
        <span class="toggle-label">Secure search</span>
        <label class="switch">
          <input type="checkbox" id="toggleSecureSearch">
          <span class="slider round"></span>
        </label>
      </div>
    </section>

    <!-- Why Blocked Banner -->
    <div class="why-blocked-box" id="whyBlockedBox">
      <div class="why-blocked-header">
        <svg class="why-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3m0 4h.01" />
        </svg>
        <strong>Why blocked?</strong>
      </div>
      <p class="why-blocked-text" id="whyBlockedText">adnet-x.com tried to follow you across sites. Ask advisor</p>
      <button class="why-advisor-link" id="btnAskAdvisor">Ask AI Advisor &rarr;</button>
    </div>

    <!-- Quick AI Advisor Drawer (Expandable) -->
    <div class="advisor-drawer" id="advisorDrawer" style="display: none;">
      <div class="drawer-header">
        <span>panH AI Advisor</span>
        <button class="drawer-close" id="btnCloseDrawer">&times;</button>
      </div>
      <div class="drawer-content" id="drawerAnswer">
        Loading advisor analysis...
      </div>
    </div>

    <!-- Footer Actions -->
    <footer class="footer">
      <button class="btn-dashboard" id="btnOpenDashboard">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="9" />
          <rect x="14" y="3" width="7" height="5" />
          <rect x="14" y="12" width="7" height="9" />
          <rect x="3" y="16" width="7" height="5" />
        </svg>
        <span>Open Full Dashboard</span>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
