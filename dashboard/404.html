<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>panH - Page Not Found</title>
  <link rel="stylesheet" href="dashboard.css">
  <style>
    body {
      background-color: #0B1426;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .error-card {
      background: #17263D;
      border: 1px solid rgba(39, 183, 214, 0.2);
      border-radius: 12px;
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .error-code {
      font-size: 72px;
      font-weight: 800;
      color: #27B7D6;
      line-height: 1;
      margin: 0 0 12px;
      letter-spacing: -2px;
    }
    .error-title {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      margin: 0 0 16px;
    }
    .error-desc {
      font-size: 14px;
      color: #94A3B8;
      line-height: 1.6;
      margin: 0 0 32px;
    }
    .actions-row {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn-return {
      background: linear-gradient(135deg, #27B7D6 0%, #1D4ED8 100%);
      color: #FFFFFF;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn-return:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #CBD5E1;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Resource or View Not Found</h1>
    <p class="error-desc">
      The dashboard view or resource you requested could not be located. Your browser shield and AI privacy protections remain fully active in the background.
    </p>
    <div class="actions-row">
      <a href="dashboard.html" class="btn-return">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Return to Overview
      </a>
      <button class="btn-secondary" onclick="window.close()">Close Window</button>
    </div>
  </div>
</body>
</html>
